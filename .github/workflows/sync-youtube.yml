name: Sincronizar vídeos de YouTube

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Traer los últimos vídeos del canal
        run: node scripts/sync-youtube.mjs

      - name: Guardar si ha cambiado algo
        run: |
          if git diff --quiet -- src/config/youtube.json; then
            echo "Sin novedades en el canal."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config/youtube.json
          git commit -m "Actualizar vídeos del canal"
          git push
