    <script>
      // Las luces se deciden antes de pintar: si no, quien entra de noche ve un
      // fogonazo de papel blanco antes de que React llegue a montarse.
      (function () {
        try {
          var g = localStorage.getItem("cyp:luces");
          var noche =
            g === "noche" ||
            (g !== "dia" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (noche) document.documentElement.classList.add("noche");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
