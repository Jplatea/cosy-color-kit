<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Museo Culow &amp; Pililarge" />
    <meta property="og:description" content="Colección permanente. Dos piezas de poliestireno mate, una audioguía y un vestuario entero." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Las luces se deciden antes de pintar: si no, quien ya eligió la noche
      // ve un fogonazo de papel blanco antes de que React llegue a montarse.
      //
      // El museo abre de día siempre. Antes seguía al sistema, y eso hacía que
      // media visita entrara por la puerta de noche sin haberlo pedido: la
      // sala es de papel hueso y tinta negra, y esa es la primera impresión
      // que tiene que dar. La noche sigue estando, pero se enciende a mano.
      (function () {
        try {
          if (localStorage.getItem("cyp:luces") === "noche")
            document.documentElement.classList.add("noche");
        } catch (e) {}

        /*
          La visita empieza por la puerta.

          El navegador recuerda por dónde ibas y al volver te deja en mitad de
          una sala, que en una página tan larga como esta desorienta: no se
          entiende si has entrado o si te has perdido. Se le quita esa manía
          —`scrollRestoration` a mano— y se sube arriba al cargar.

          Salvo que la dirección traiga un ancla. Si alguien comparte el enlace
          de la tienda, tiene que abrirse en la tienda; ahí el que manda es el
          `#`, no esto.
        */
        try {
          if ("scrollRestoration" in history) history.scrollRestoration = "manual";
          if (!location.hash) {
            window.addEventListener("load", function () {
              window.scrollTo(0, 0);
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
