<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 129 102" role="img" aria-label="Culow y Pililarge">
  <title>Culow &amp; Pililarge — símbolo</title>
  <!--
    El símbolo son los dos personajes reducidos a su silueta:
    Culow, dos esferas unidas con la hendidura justa para que se lean como dos.
    Pililarge, una barra vertical de esquinas blandas y misma masa óptica.
    Todo en `currentColor` para poder pintarlo en crema, dorado o negro.
  -->
  <g fill="currentColor">
    <circle cx="33" cy="64" r="27"/>
    <circle cx="60" cy="64" r="27"/>
    <rect x="97" y="12" width="26" height="79" rx="13"/>
  </g>
</svg>
